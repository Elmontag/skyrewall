# docker-compose.example.yml — Copy to docker-compose.yml and adjust for your setup.
# IMPORTANT: Set all variables in your .env file before deploying.
# See .env.example for the expected format.
# Generate secrets with: openssl rand -hex 32

services:
  app:
    build: .
    ports:
      - "3000:3000"         # Expose to host (use reverse proxy in production)
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-60}
      # Required for AT Protocol OAuth (Sign in with Bluesky).
      # Set to the public HTTPS URL of your deployment, e.g. https://skyrewall.example.com
      # Leave empty or omit to disable OAuth (app-password login still works).
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skyrewall-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - skyrewall-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NOT exposing port 5432 to keep DB only accessible within Docker network

volumes:
  postgres_data:

networks:
  skyrewall-net:
    driver: bridge
